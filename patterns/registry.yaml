# patterns/registry.yaml — flat registry of the Day 3 loop-library kits
#
# Owned by patterns-page-loop (Day 3, Loop 3). Sole author of this schema —
# there is no prior example in this repo to match. One entry per kit in
# starters/ (excluding _template), in the same order as kit-state.md's
# 20-row checklist. Each entry's `name` matches its starters/<name>/ folder
# exactly (checked by scripts/validate-registry.mjs) and its matching spec
# page lives at patterns/<name>.md.
#
# Field notes:
#   group          — "A" (kept as-is, written from this course's own S1-S9
#                    sources) or "B" (curated from Forward Future's Loop
#                    Library, adapted with a named-author Source line).
#   level          — the level every kit actually SHIPS at today (all 20
#                    ship L1 report-only first, per CLAUDE.md rule 4 and
#                    kit-state.md's own header + Findings correction).
#   target_level   — kit-state.md's catalog "Level" column: the level the
#                    kit's own LOOP.md documents as an EARNED promotion, not
#                    its starting shape. Equal to `level` when the catalog
#                    never named a higher target.
#   source_author  — for group A, the course source (S1) and the step/
#                    section it draws from; for group B, the named original
#                    author credited in the kit's own LOOP.md footer.
#   source_url     — the real, live hyperlink backing source_author (the S1
#                    course URL for group A; the kit's own Forward Future
#                    Loop Library detail-page URL for group B).

- name: daily-triage
  category_code: "A"
