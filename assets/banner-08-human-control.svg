<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Human Control — Cost · verification · staying the engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="200" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="18" fill="url(#sheen)"/>
  <circle cx="1010" cy="100" r="150" fill="url(#orb)"/>

  <!-- number chip -->
  <g transform="translate(64,64)">
    <rect x="0" y="0" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5"/>
    <text x="56.0" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">Part 6</text>
  </g>

  <text x="64" y="132" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Human Control</text>
  <text x="66" y="164" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.92">Cost · verification · staying the engineer</text>

  <!-- loop-glyph medallion (consistent brand mark) -->
  <g transform="translate(1010,100)">
    <circle r="66" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6" stroke-dasharray="207 69" stroke-linecap="round" transform="rotate(-90)"/>
    <path d="M 33 -34 l 5 -15 l 13 10 z" fill="#ffffff"/>
    <circle r="12" fill="#ffffff"/>
  </g>
</svg>
