<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 366" role="img" aria-label="Loop Engineering: a heartbeat runs the agent, a checker verifies, a spine remembers, a provable stop ends the run — with the human as engineer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.45" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="366" rx="20" fill="url(#bg)"/>
  <circle cx="600" cy="185" r="155" fill="url(#glow)"/>

  <!-- title block -->
  <text x="70" y="150" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="0.5">Loop Engineering</text>
  <text x="72" y="188" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#c7d2fe">Design the system that prompts the agent —</text>
  <text x="72" y="214" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#c7d2fe">not the prompt.</text>
  <rect x="72" y="234" width="132" height="5" rx="2.5" fill="url(#ring)"/>

  <!-- the loop ring -->
  <g transform="translate(600,190)">
    <circle r="112" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity="0.30"/>
    <circle r="112" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="150 554" stroke-linecap="round" transform="rotate(-90)"/>

    <!-- heartbeat (top): ECG pulse -->
    <g transform="translate(0,-112)">
      <circle r="30" fill="#fbbf24" stroke="#fde68a" stroke-width="2"/>
      <path d="M -16 0 L -7 0 L -2 -11 L 3 12 L 8 -4 L 12 0 L 16 0" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fde68a">heartbeat</text>
    </g>

    <!-- body / agent (right): chip -->
    <g transform="translate(112,0)">
      <circle r="30" fill="#818cf8" stroke="#c7d2fe" stroke-width="2"/>
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="none" stroke="#312e81" stroke-width="3"/>
      <path d="M -6 -19 v 5 M 0 -19 v 5 M 6 -19 v 5 M -6 14 v 5 M 0 14 v 5 M 6 14 v 5 M -19 -6 h 5 M -19 0 h 5 M -19 6 h 5 M 14 -6 h 5 M 14 0 h 5 M 14 6 h 5" stroke="#312e81" stroke-width="2.4" stroke-linecap="round"/>
      <text y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">body</text>
    </g>

    <!-- checker (bottom): check -->
    <g transform="translate(0,112)">
      <circle r="30" fill="#2dd4bf" stroke="#99f6e4" stroke-width="2"/>
      <path d="M -13 1 L -4 11 L 14 -11" fill="none" stroke="#0f766e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#99f6e4">checker</text>
    </g>

    <!-- spine (left): stacked layers -->
    <g transform="translate(-112,0)">
      <circle r="30" fill="#c084fc" stroke="#e9d5ff" stroke-width="2"/>
      <g stroke="#6b21a8" stroke-width="3" fill="none" stroke-linejoin="round">
        <rect x="-14" y="-13" width="28" height="8" rx="2"/>
        <rect x="-14" y="-4" width="28" height="8" rx="2"/>
        <rect x="-14" y="5" width="28" height="8" rx="2"/>
      </g>
      <text y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">spine</text>
    </g>

    <!-- flow arrows around the ring -->
    <g fill="#c7d2fe">
      <path d="M 79 -79 l 6 -12 l 7 12 z"/>
      <path d="M 79 79 l 13 -1 l -6 12 z"/>
      <path d="M -79 79 l -6 12 l -7 -12 z"/>
      <path d="M -79 -79 l -13 1 l 6 -12 z"/>
    </g>

    <!-- center: provable stop -->
    <circle r="35" fill="#0b1220" stroke="url(#ring)" stroke-width="2.5"/>
    <text y="-2" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">provable</text>
    <text y="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">stop</text>
  </g>

  <!-- human / engineer marker -->
  <g transform="translate(946,258)">
    <rect x="0" y="-24" width="196" height="48" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#c7d2fe" stroke-opacity="0.4"/>
    <g transform="translate(26,0)">
      <circle cy="-6" r="7" fill="#93c5fd"/>
      <path d="M -11 12 a 11 11 0 0 1 22 0 z" fill="#93c5fd"/>
    </g>
    <text x="48" y="-2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">you stay</text>
    <text x="48" y="15" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">the engineer</text>
  </g>
</svg>
