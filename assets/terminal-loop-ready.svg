<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" role="img" aria-label="Terminal demo: npm run audit:loops runs ten real checks across all 20 starter kits and the Loop Ready score climbs to 100 out of 100.">
  <defs>
    <linearGradient id="tbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241353"/>
      <stop offset="1" stop-color="#180b38"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.65" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; }
    .ui   { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim    { fill: #8b87a8; }
    .txt    { fill: #e9e6f7; }
    .green  { fill: #34d399; }
    .red    { fill: #f87171; }
    .purple { fill: #c4b5fd; }

    .appear { opacity: 0; animation: appear 0.4s ease-out forwards; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cmd  { animation-delay: 0.3s; }
    .scan { animation-delay: 1.3s; }
    .r0 { animation-delay: 1.90s; }
    .r1 { animation-delay: 2.22s; }
    .r2 { animation-delay: 2.54s; }
    .r3 { animation-delay: 2.86s; }
    .r4 { animation-delay: 3.18s; }
    .r5 { animation-delay: 3.50s; }
    .r6 { animation-delay: 3.82s; }
    .r7 { animation-delay: 4.14s; }
    .r8 { animation-delay: 4.46s; }
    .r9 { animation-delay: 4.78s; }
    .summary { animation-delay: 5.48s; }

    .cursor { animation: blink 1s steps(2, start) infinite, vanish 0.1s linear 1.3s forwards; }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes vanish { to  { opacity: 0; } }

    .ringFill {
      stroke-dasharray: 527.8;
      stroke-dashoffset: 527.8;
      animation: ring 3.38s cubic-bezier(0.4, 0, 0.2, 1) 1.9s forwards;
    }
    @keyframes ring { to { stroke-dashoffset: 0.0; } }

    .n0 { opacity: 0; animation: n0 7s linear forwards; }
    @keyframes n0 { 0%, 5.71% { opacity: 0; } 6.00%, 29.29% { opacity: 1; } 29.57%, 100% { opacity: 0; } }
    .n1 { opacity: 0; animation: n1 7s linear forwards; }
    @keyframes n1 { 0%, 29.29% { opacity: 0; } 29.57%, 33.86% { opacity: 1; } 34.14%, 100% { opacity: 0; } }
    .n2 { opacity: 0; animation: n2 7s linear forwards; }
    @keyframes n2 { 0%, 33.86% { opacity: 0; } 34.14%, 38.43% { opacity: 1; } 38.71%, 100% { opacity: 0; } }
    .n3 { opacity: 0; animation: n3 7s linear forwards; }
    @keyframes n3 { 0%, 38.43% { opacity: 0; } 38.71%, 43.00% { opacity: 1; } 43.29%, 100% { opacity: 0; } }
    .n4 { opacity: 0; animation: n4 7s linear forwards; }
    @keyframes n4 { 0%, 43.00% { opacity: 0; } 43.29%, 47.57% { opacity: 1; } 47.86%, 100% { opacity: 0; } }
    .n5 { opacity: 0; animation: n5 7s linear forwards; }
    @keyframes n5 { 0%, 47.57% { opacity: 0; } 47.86%, 52.14% { opacity: 1; } 52.43%, 100% { opacity: 0; } }
    .n6 { opacity: 0; animation: n6 7s linear forwards; }
    @keyframes n6 { 0%, 52.14% { opacity: 0; } 52.43%, 56.71% { opacity: 1; } 57.00%, 100% { opacity: 0; } }
    .n7 { opacity: 0; animation: n7 7s linear forwards; }
    @keyframes n7 { 0%, 56.71% { opacity: 0; } 57.00%, 61.29% { opacity: 1; } 61.57%, 100% { opacity: 0; } }
    .n8 { opacity: 0; animation: n8 7s linear forwards; }
    @keyframes n8 { 0%, 61.29% { opacity: 0; } 61.57%, 65.86% { opacity: 1; } 66.14%, 100% { opacity: 0; } }
    .n9 { opacity: 0; animation: n9 7s linear forwards; }
    @keyframes n9 { 0%, 65.86% { opacity: 0; } 66.14%, 70.43% { opacity: 1; } 70.71%, 100% { opacity: 0; } }
    .n10 { opacity: 0; animation: n10 7s linear forwards; }
    @keyframes n10 { 0%, 70.43% { opacity: 0; } 70.71%, 100% { opacity: 1; } }

    .verdict {
      opacity: 0;
      transform-origin: 726px 406px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 5.78s forwards;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="2" y="2" width="896" height="514" rx="14" fill="#0b0820"/>
  </g>
  <rect x="2" y="2" width="896" height="514" rx="14" fill="url(#tglow)"/>
  <rect x="2.75" y="2.75" width="894.5" height="512.5" rx="13.5" fill="none" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="26" y1="2" x2="874" y2="2" stroke="#c4b5fd" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M2,16 a14,14 0 0 1 14,-14 h868 a14,14 0 0 1 14,14 v24 h-896 z" fill="url(#tbar)"/>
  <line x1="2" y1="40" x2="898" y2="40" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="26" cy="21" r="6" fill="#f87171"/>
  <circle cx="46" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="21" r="6" fill="#34d399"/>
  <text x="450" y="26" text-anchor="middle" class="ui" font-size="13" font-weight="600" fill="#a99fd0">loop-ready-audit — ~/my-project</text>
  <rect x="826" y="10" width="58" height="21" rx="10.5" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
  <text x="855" y="25" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#c4b5fd">zsh</text>

  <!-- Command line -->
  <g class="mono appear cmd">
    <text x="28" y="78"><tspan class="green">$</tspan><tspan class="txt" dx="10">npm run audit:loops</tspan></text>
  </g>
  <rect x="230" y="65" width="9" height="17" fill="#c4b5fd" class="cursor"/>

  <!-- Scan line -->
  <g class="mono appear scan">
    <text x="28" y="112" class="dim">Auditing 20 kits in starters/ — ten checks per kit, 10 points each …</text>
  </g>

  <!-- Check rows (real audit results) -->
  <g class="mono">
    <g class="appear r0">
      <text x="36" y="150" class="green" font-weight="700">✔</text>
      <text x="64" y="150" class="txt" font-weight="600">definition</text>
      <text x="205" y="150" class="dim" font-size="12.5">LOOP.md</text>
      <text x="548" y="150" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r1">
      <text x="36" y="180" class="green" font-weight="700">✔</text>
      <text x="64" y="180" class="txt" font-weight="600">docs</text>
      <text x="205" y="180" class="dim" font-size="12.5">README.md</text>
      <text x="548" y="180" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r2">
      <text x="36" y="210" class="green" font-weight="700">✔</text>
      <text x="64" y="210" class="txt" font-weight="600">spine</text>
      <text x="205" y="210" class="dim" font-size="12.5">&lt;kit&gt;-state.md</text>
      <text x="548" y="210" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r3">
      <text x="36" y="240" class="green" font-weight="700">✔</text>
      <text x="64" y="240" class="txt" font-weight="600">budget</text>
      <text x="205" y="240" class="dim" font-size="12.5">loop-budget.md</text>
      <text x="548" y="240" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r4">
      <text x="36" y="270" class="green" font-weight="700">✔</text>
      <text x="64" y="270" class="txt" font-weight="600">constitution</text>
      <text x="205" y="270" class="dim" font-size="12.5">loop-constraints.md</text>
      <text x="548" y="270" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r5">
      <text x="36" y="300" class="green" font-weight="700">✔</text>
      <text x="64" y="300" class="txt" font-weight="600">run log</text>
      <text x="205" y="300" class="dim" font-size="12.5">loop-run-log.md</text>
      <text x="548" y="300" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r6">
      <text x="36" y="330" class="green" font-weight="700">✔</text>
      <text x="64" y="330" class="txt" font-weight="600">checker</text>
      <text x="205" y="330" class="dim" font-size="12.5">.claude/agents/loop-verifier.md</text>
      <text x="548" y="330" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r7">
      <text x="36" y="360" class="green" font-weight="700">✔</text>
      <text x="64" y="360" class="txt" font-weight="600">skill</text>
      <text x="205" y="360" class="dim" font-size="12.5">.claude/skills/loop-task/SKILL.md</text>
      <text x="548" y="360" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r8">
      <text x="36" y="390" class="green" font-weight="700">✔</text>
      <text x="64" y="390" class="txt" font-weight="600">dual tool</text>
      <text x="205" y="390" class="dim" font-size="12.5">opencode.json + loop-task.md</text>
      <text x="548" y="390" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
    <g class="appear r9">
      <text x="36" y="420" class="green" font-weight="700">✔</text>
      <text x="64" y="420" class="txt" font-weight="600">filled in</text>
      <text x="205" y="420" class="dim" font-size="12.5">no unfilled template placeholders</text>
      <text x="548" y="420" text-anchor="end" class="green" font-weight="700">20/20</text>
    </g>
  </g>

  <!-- Summary -->
  <g class="mono appear summary">
    <text x="28" y="476"><tspan class="green" font-weight="700">✔ 20 / 20 kits Loop Ready</tspan><tspan class="dim" dx="12">·</tspan><tspan class="purple" dx="12">exit 0</tspan></text>
  </g>

  <!-- Score ring -->
  <g>
    <circle cx="726" cy="278" r="110" fill="url(#ringGlow)"/>
    <circle cx="726" cy="278" r="84" fill="none" stroke="#241353" stroke-width="12"/>
    <circle class="ringFill" cx="726" cy="278" r="84" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 726 278)"/>
      <text x="726" y="286" text-anchor="middle" class="ui n0" font-size="44" font-weight="800" fill="#f5f3ff">0</text>
      <text x="726" y="286" text-anchor="middle" class="ui n1" font-size="44" font-weight="800" fill="#f5f3ff">10</text>
      <text x="726" y="286" text-anchor="middle" class="ui n2" font-size="44" font-weight="800" fill="#f5f3ff">20</text>
      <text x="726" y="286" text-anchor="middle" class="ui n3" font-size="44" font-weight="800" fill="#f5f3ff">30</text>
      <text x="726" y="286" text-anchor="middle" class="ui n4" font-size="44" font-weight="800" fill="#f5f3ff">40</text>
      <text x="726" y="286" text-anchor="middle" class="ui n5" font-size="44" font-weight="800" fill="#f5f3ff">50</text>
      <text x="726" y="286" text-anchor="middle" class="ui n6" font-size="44" font-weight="800" fill="#f5f3ff">60</text>
      <text x="726" y="286" text-anchor="middle" class="ui n7" font-size="44" font-weight="800" fill="#f5f3ff">70</text>
      <text x="726" y="286" text-anchor="middle" class="ui n8" font-size="44" font-weight="800" fill="#f5f3ff">80</text>
      <text x="726" y="286" text-anchor="middle" class="ui n9" font-size="44" font-weight="800" fill="#f5f3ff">90</text>
      <text x="726" y="286" text-anchor="middle" class="ui n10" font-size="44" font-weight="800" fill="#f5f3ff">100</text>
    <text x="726" y="312" text-anchor="middle" class="ui" font-size="13" font-weight="600" fill="#8b87a8">/ 100</text>
    <text x="726" y="170" text-anchor="middle" class="ui" font-size="13" font-weight="700" letter-spacing="3" fill="#a99fd0">LOOP READY</text>
    <g class="verdict">
      <rect x="664" y="388" width="124" height="30" rx="15" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5"/>
      <text x="726" y="408" text-anchor="middle" class="ui" font-size="13" font-weight="800" fill="#34d399">ALL KITS PASS</text>
    </g>
  </g>
</svg>
