name: markdown-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !node_modules
            !web
            # vendored skills.sh toolchain — third-party files, not ours to lint
            !skills
            !.agents
            !.claude
            # internal planning docs (not course content); heading structure is
            # the human's editorial choice, outside the course-quality gate
            !loop-plan.md
            !days-plans
